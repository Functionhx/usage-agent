<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 用量统计 · Usage</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1b1f; --muted: #6b6b76; --line: #e4e4ea;
    --card: #f7f7fa; --accent: #3b6fd4;
    /* 热力图色阶：照 GitHub 贡献图的绿 */
    --h0: #ebedf0; --h1: #9be9a8; --h2: #40c463; --h3: #30a14e; --h4: #216e39;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #e8e8ee; --muted: #9a9aa6; --line: #2c2c34;
      --card: #1e1e24; --accent: #6f9bea;
      --h0: #1e1e24; --h1: #0e4429; --h2: #006d32; --h3: #26a641; --h4: #39d353;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; font-weight: 600; }
  h2 { font-size: .95rem; margin: 2rem 0 .75rem; font-weight: 600; color: var(--muted);
       text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 1.5rem; }

  .totals { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: .5rem; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: .75rem 1rem; flex: 1 1 150px; }
  .stat .k { color: var(--muted); font-size: .78rem; display: block; margin-bottom: .15rem; }
  .stat .v { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .n { color: var(--muted); font-size: .74rem; display: block; margin-top: .15rem; }

  /* ── 热力图 ── */
  .heat-wrap { overflow-x: auto; padding-bottom: .25rem; }
  .heat { display: inline-grid; gap: 3px; }
  .heat .months {
    display: grid; gap: 3px; font-size: .7rem; color: var(--muted);
    align-items: end; height: 1rem;
  }
  .heat .body { display: grid; grid-auto-flow: column; gap: 3px; }
  .heat .col { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; }
  .heat .cell {
    width: 11px; height: 11px; border-radius: 2px; background: var(--h0);
    outline: 1px solid rgba(27,31,35,.06); outline-offset: -1px;
  }
  .heat .cell.l1 { background: var(--h1); }
  .heat .cell.l2 { background: var(--h2); }
  .heat .cell.l3 { background: var(--h3); }
  .heat .cell.l4 { background: var(--h4); }
  .heat .cell.pad { background: transparent; outline: none; }
  .heat-legend { display: flex; align-items: center; gap: .35rem;
                 font-size: .72rem; color: var(--muted); margin-top: .6rem; }
  .heat-legend .cell { width: 11px; height: 11px; border-radius: 2px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .4rem .5rem; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  td.dim { color: var(--muted); font-size: .82rem; }

  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px;
            overflow: hidden; margin-bottom: 1rem; }
  .toggle button {
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
    font: inherit; font-size: .82rem; padding: .3rem .8rem;
  }
  .toggle button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .error { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           padding: 1rem; color: var(--muted); }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line);
           color: var(--muted); font-size: .82rem; }
  a { color: var(--accent); }
  .tip { position: fixed; pointer-events: none; background: #24292f; color: #fff;
         font-size: .76rem; padding: .35rem .55rem; border-radius: 6px; opacity: 0;
         transition: opacity .1s; z-index: 9; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>AI 用量统计</h1>
  <p class="sub">
    每日 token 用量与估算花费。数据由各机器本地解析自身日志后发布；此页面只读取聚合结果，
    不含项目名、路径或任何对话内容。<br>
    <span lang="en">Daily token usage and estimated cost. Aggregates only — no project names, paths, or message content.</span>
  </p>

  <div id="app"><p class="sub">载入中… / Loading…</p></div>

  <footer>
    <a href="https://github.com/Functionhx/usage-agent">仓库 / Repository</a> ·
    数据每日自动更新 · 价格来自厂商官方定价页
  </footer>
</main>
<div class="tip" id="tip" role="tooltip"></div>

<script>
"use strict";
const MANIFEST = "data/hosts.json";
const DOW = ["日", "一", "二", "三", "四", "五", "六"];
const MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const $ = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };

function fmtTokens(n) {
  if (!n) return "0";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(0) + "k";
  return String(n);
}
function fmtUSD(v) {
  if (!v) return "$0.00";
  if (v < 0.01) return "$" + v.toFixed(4);
  if (v < 1000) return "$" + v.toFixed(2);
  return "$" + Math.round(v).toLocaleString("en-US");
}
// 数量级差异很大（$0.01 到 $600），用平方根压缩，否则小日子全被压成同一档
const level = (v, max) => (!v || !max ? 0 : Math.min(4, Math.max(1, Math.ceil(Math.sqrt(v / max) * 4))));

async function main() {
  const app = document.getElementById("app");
  let hosts;
  try {
    const res = await fetch(MANIFEST, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    hosts = await res.json();
  } catch (err) {
    app.replaceChildren(box("数据清单载入失败：" + err.message));
    return;
  }
  if (!Array.isArray(hosts) || hosts.length === 0) {
    app.replaceChildren(box("还没有任何机器发布过数据。"));
    return;
  }

  const results = await Promise.all(hosts.map(async (h) => {
    try {
      const res = await fetch("data/" + encodeURIComponent(h) + ".json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return { host: h, data: await res.json() };
    } catch (err) {
      return { host: h, error: err.message };
    }
  }));

  const ok = results.filter((r) => r.data);
  if (ok.length === 0) { app.replaceChildren(box("所有数据源都载入失败。")); return; }
  render(app, ok, results.filter((r) => r.error));
}

function box(msg) { const d = $("div", "error"); d.textContent = msg; return d; }

function render(app, hosts, failed) {
  app.replaceChildren();

  // 按日期合并各机器
  const byDate = new Map();
  const byModel = new Map();
  const perHost = [];
  for (const { host, data } of hosts) {
    // 优先用顶层 totals（发布端算好的，定义只有一处）；没有就按天累加
    const t = data.totals || (data.days || []).reduce((a, d) => ({
      cost: a.cost + d.cost, tokens: a.tokens + d.tokens,
      cacheRead: a.cacheRead + (d.cacheRead || 0),
      tokensInclCache: a.tokensInclCache + (d.tokensInclCache || d.tokens + (d.cacheRead || 0)),
    }), { cost: 0, tokens: 0, cacheRead: 0, tokensInclCache: 0 });
    perHost.push({ host, data, totals: t, latest: data.updatedAt || "" });

    for (const d of data.days || []) {
      const cur = byDate.get(d.date) || { date: d.date, cost: 0, tokens: 0, cacheRead: 0, tokensInclCache: 0 };
      cur.cost += d.cost;
      cur.tokens += d.tokens;
      cur.cacheRead += d.cacheRead || 0;
      cur.tokensInclCache += d.tokensInclCache || (d.tokens + (d.cacheRead || 0));
      byDate.set(d.date, cur);
      for (const m of d.byModel || []) {
        const mm = byModel.get(m.model) || { model: m.model, cost: 0, tokens: 0, cacheRead: 0, tokensInclCache: 0 };
        mm.cost += m.cost; mm.tokens += m.tokens;
        mm.cacheRead += m.cacheRead || 0;
        mm.tokensInclCache += m.tokensInclCache || (m.tokens + (m.cacheRead || 0));
        byModel.set(m.model, mm);
      }
    }
  }
  const days = [...byDate.values()].sort((a, b) => (a.date < b.date ? -1 : 1));

  const sum = (key) => perHost.reduce((a, h) => a + (h.totals[key] || 0), 0);
  const latest = perHost.map((h) => h.latest).sort().pop() || "";

  // ── 总计 ──
  const totals = $("div", "totals");
  const stat = (k, v, note) => {
    const d = $("div", "stat");
    const kk = $("span", "k"); kk.textContent = k;
    const vv = $("span", "v"); vv.textContent = v;
    d.append(kk, vv);
    if (note) { const nn = $("span", "n"); nn.textContent = note; d.append(nn); }
    return d;
  };
  totals.append(
    stat("总花费 / Total cost", fmtUSD(sum("cost"))),
    stat("Token 总量（含 cache）", fmtTokens(sum("tokensInclCache")), "实际消耗的总 token"),
    stat("其中 cache read", fmtTokens(sum("cacheRead")), "单价较低，但仍计入总量"),
    stat("不含 cache 的 token", fmtTokens(sum("tokens"))),
    stat("记录天数 / Days", String(days.length)),
  );
  app.append(totals);

  // ── 热力图 ──
  const h2h = $("h2"); h2h.textContent = "每日用量 / Daily activity";
  const toggle = $("div", "toggle");
  let metric = "cost";
  const btnCost = $("button"); btnCost.textContent = "按花费"; btnCost.setAttribute("aria-pressed", "true");
  const btnTok = $("button"); btnTok.textContent = "按 token"; btnTok.setAttribute("aria-pressed", "false");
  toggle.append(btnCost, btnTok);
  const heatBox = $("div");
  app.append(h2h, toggle, heatBox);

  const draw = () => {
    heatBox.replaceChildren(makeHeatmap(days, metric));
  };
  btnCost.onclick = () => { metric = "cost"; btnCost.setAttribute("aria-pressed", "true"); btnTok.setAttribute("aria-pressed", "false"); draw(); };
  btnTok.onclick = () => { metric = "tokens"; btnTok.setAttribute("aria-pressed", "true"); btnCost.setAttribute("aria-pressed", "false"); draw(); };
  draw();

  // ── 按模型 ──
  const models = [...byModel.values()].sort((a, b) => b.cost - a.cost);
  if (models.length) {
    const h = $("h2"); h.textContent = "按模型 / By model";
    const table = $("table");
    const thead = $("thead"); const hr = $("tr");
    for (const [txt, align] of [["模型 / Model", "left"], ["花费 / Cost", "right"],
      ["Token 总量", "right"], ["其中 cache", "right"], ["不含 cache", "right"]]) {
      const th = $("th"); th.textContent = txt; if (align) th.style.textAlign = align; hr.append(th);
    }
    thead.append(hr);
    const tb = $("tbody");
    for (const m of models) {
      const tr = $("tr");
      const cells = [[m.model, "left"], [fmtUSD(m.cost), ""], [fmtTokens(m.tokensInclCache), ""],
        [fmtTokens(m.cacheRead), "dim"], [fmtTokens(m.tokens), "dim"]];
      for (const [txt, cls] of cells) {
        const td = $("td"); td.textContent = txt;
        if (cls === "left") td.style.textAlign = "left";
        if (cls === "dim") td.className = "dim";
        tr.append(td);
      }
      tb.append(tr);
    }
    table.append(thead, tb);
    app.append(h, table);
  }

  // ── 按机器 ──
  const h3 = $("h2"); h3.textContent = "按机器 / By host";
  const t2 = $("table");
  const hd2 = $("thead"); const r2 = $("tr");
  for (const txt of ["机器 / Host", "花费 / Cost", "Token 总量", "天数", "最近更新"]) {
    const th = $("th"); th.textContent = txt; r2.append(th);
  }
  hd2.append(r2);
  const tb2 = $("tbody");
  for (const { host, data, totals: t, latest: up } of perHost) {
    const tr = $("tr");
    for (const txt of [host, fmtUSD(t.cost), fmtTokens(t.tokensInclCache),
      String((data.days || []).length), (up || "").slice(0, 10)]) {
      const td = $("td"); td.textContent = txt; tr.append(td);
    }
    tb2.append(tr);
  }
  t2.append(hd2, tb2);
  app.append(h3, t2);

  for (const f of failed) app.append(box("机器 " + f.host + " 的数据载入失败：" + f.error));

  if (latest) {
    const p = $("p", "sub"); p.style.marginTop = "1.5rem";
    p.textContent = "最近更新 " + latest.replace("T", " ").replace("Z", " UTC");
    app.append(p);
  }
}

/** 生成 GitHub 贡献图样式的热力图。 */
function makeHeatmap(days, metric) {
  const wrap = $("div", "heat-wrap");
  if (days.length === 0) { wrap.append(box("暂无数据")); return wrap; }
  const byDate = new Map(days.map((d) => [d.date, d]));
  const value = (d) => (metric === "cost" ? d.cost : d.tokensInclCache);
  const max = Math.max(...days.map(value), 1e-9);

  // 从第一个日期所在周的周日，排到最后一个日期所在周的周六
  const first = new Date(days[0].date + "T00:00:00Z");
  const last = new Date(days[days.length - 1].date + "T00:00:00Z");
  const start = new Date(first); start.setUTCDate(start.getUTCDate() - start.getUTCDay());
  const end = new Date(last); end.setUTCDate(end.getUTCDate() + (6 - end.getUTCDay()));

  const grid = $("div", "heat");
  const weeks = [];
  for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    weeks.push(new Date(d));
  }
  const cols = [];
  for (let i = 0; i < weeks.length; i += 7) cols.push(weeks.slice(i, i + 7));

  // 月份标签：某列包含该月 1 号时打标签
  const months = $("div", "months");
  months.style.gridTemplateColumns = `repeat(${cols.length}, 11px)`;
  let prevMonth = -1;
  for (const col of cols) {
    const label = $("span");
    const m = col[0].getUTCMonth();
    if (m !== prevMonth && col.some((x) => x.getUTCDate() <= 7)) {
      label.textContent = MONTHS[m];
      prevMonth = m;
    }
    months.append(label);
  }

  const body = $("div", "body");
  for (const col of cols) {
    const c = $("div", "col");
    for (const day of col) {
      const k = day.toISOString().slice(0, 10);
      const cell = $("div", "cell");
      const rec = byDate.get(k);
      if (!rec && (k < days[0].date || k > days[days.length - 1].date)) {
        cell.classList.add("pad");           // 数据范围外的补位格
      } else if (rec) {
        const lv = level(value(rec), max);
        if (lv > 0) cell.classList.add("l" + lv);
        cell.dataset.tip = `${k}（周${DOW[day.getUTCDay()]}）\n`
          + `花费 ${fmtUSD(rec.cost)}\n`
          + `Token ${fmtTokens(rec.tokensInclCache)}（cache ${fmtTokens(rec.cacheRead)}）`;
      } else {
        cell.dataset.tip = `${k}（周${DOW[day.getUTCDay()]}）\n无用量`;
      }
      c.append(cell);
    }
    body.append(c);
  }

  grid.append(months, body);
  wrap.append(grid);

  const legend = $("div", "heat-legend");
  const lt = $("span"); lt.textContent = metric === "cost" ? "花费少" : "用量少";
  legend.append(lt);
  for (const lv of [0, 1, 2, 3, 4]) {
    const c = $("div", "cell"); if (lv) c.classList.add("l" + lv); legend.append(c);
  }
  const ltm = $("span"); ltm.textContent = metric === "cost" ? "多" : "多";
  legend.append(ltm);
  const note = $("span");
  note.style.marginLeft = "1rem";
  note.textContent = metric === "cost"
    ? `最深 = ${fmtUSD(max)}/天`
    : `最深 = ${fmtTokens(max)}/天`;
  legend.append(note);
  wrap.append(legend);

  // 悬停提示
  const tip = document.getElementById("tip");
  wrap.addEventListener("mouseover", (e) => {
    const t = e.target.dataset && e.target.dataset.tip;
    if (!t) return;
    tip.textContent = t;
    tip.style.whiteSpace = "pre-line";
    tip.style.opacity = "1";
  });
  wrap.addEventListener("mousemove", (e) => {
    tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px";
    tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 10) + "px";
  });
  wrap.addEventListener("mouseout", () => { tip.style.opacity = "0"; });

  return wrap;
}

main();
</script>
</body>
</html>
